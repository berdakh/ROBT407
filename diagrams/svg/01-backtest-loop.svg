<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">The backtest loop, one bar at a time</title>
  <desc id="desc">Five ordered steps the engine performs for each bar: advance the clock, settle the previous bar's orders at this bar's open, mark to market at the close, ask the strategy for a decision, record. Orders decided on bar i can only fill on bar i+1.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #d0d7de;
      --surface: #f6f8fa;
      --accent: #0969da;
      --accent-bg: #ddf4ff;
      --good: #1a7f37;
      --good-bg: #dafbe1;
      --bad: #cf222e;
      --bad-bg: #ffebe9;
      --warn: #9a6700;
      --warn-bg: #fff8c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #30363d;
        --surface: #161b22;
        --accent: #4493f8;
        --accent-bg: #0c2d6b;
        --good: #3fb950;
        --good-bg: #0f3d1c;
        --bad: #f85149;
        --bad-bg: #4a1418;
        --warn: #d29922;
        --warn-bg: #3d2c00;
      }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .card { fill: var(--surface); stroke: var(--line); }
    .edge { stroke: var(--line); fill: none; }
  </style>
  <rect class="bg" width="940" height="560"/>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="470.0" y="38" font-size="22" font-weight="650" text-anchor="middle">The backtest loop, one bar at a time</text>
  <text x="470.0" y="62" font-size="13" font-weight="400" text-anchor="middle" class="muted mono">for i in range(n_bars):   # the strategy is asked LAST, and cannot act until i+1</text>
  <rect x="104" y="92" width="466" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="132" cy="128.0" r="15" fill="var(--accent-bg)"/>
  <text x="132" y="133.0" font-size="14" font-weight="700" text-anchor="middle" fill="var(--accent)">1</text>
  <text x="160" y="119" font-size="15" font-weight="600" text-anchor="start">Advance the clock to bar i</text>
  <text x="160" y="138" font-size="12" font-weight="400" text-anchor="start" class="muted">view can now see bars 0..i and nothing beyond.</text>
  <text x="160" y="153" font-size="12" font-weight="400" text-anchor="start" class="muted">This single line is the look-ahead guarantee.</text>
  <line x1="337.0" y1="164" x2="337.0" y2="178" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="104" y="178" width="466" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="132" cy="214.0" r="15" fill="var(--good-bg)"/>
  <text x="132" y="219.0" font-size="14" font-weight="700" text-anchor="middle" fill="var(--good)">2</text>
  <text x="160" y="205" font-size="15" font-weight="600" text-anchor="start">Settle orders from bar i-1</text>
  <text x="160" y="224" font-size="12" font-weight="400" text-anchor="start" class="muted">Fill at bar i's OPEN, minus fees and spread.</text>
  <text x="160" y="239" font-size="12" font-weight="400" text-anchor="start" class="muted">Decided last bar; traded now.</text>
  <line x1="337.0" y1="250" x2="337.0" y2="264" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="104" y="264" width="466" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="132" cy="300.0" r="15" fill="var(--line)"/>
  <text x="132" y="305.0" font-size="14" font-weight="700" text-anchor="middle" fill="var(--fg)">3</text>
  <text x="160" y="291" font-size="15" font-weight="600" text-anchor="start">Mark to market at bar i's CLOSE</text>
  <text x="160" y="310" font-size="12" font-weight="400" text-anchor="start" class="muted mono">equity = cash + units x close</text>
  <line x1="337.0" y1="336" x2="337.0" y2="350" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="104" y="350" width="466" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="132" cy="386.0" r="15" fill="var(--accent-bg)"/>
  <text x="132" y="391.0" font-size="14" font-weight="700" text-anchor="middle" fill="var(--accent)">4</text>
  <text x="160" y="377" font-size="15" font-weight="600" text-anchor="start">Ask the strategy</text>
  <text x="160" y="396" font-size="12" font-weight="400" text-anchor="start" class="muted mono">on_bar(view, account) -&gt; target weight.</text>
  <text x="160" y="411" font-size="12" font-weight="400" text-anchor="start" class="muted">Anything it returns is QUEUED for bar i+1.</text>
  <line x1="337.0" y1="422" x2="337.0" y2="436" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="104" y="436" width="466" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="132" cy="472.0" r="15" fill="var(--line)"/>
  <text x="132" y="477.0" font-size="14" font-weight="700" text-anchor="middle" fill="var(--fg)">5</text>
  <text x="160" y="463" font-size="15" font-weight="600" text-anchor="start">Record equity, weight, position</text>
  <text x="160" y="482" font-size="12" font-weight="400" text-anchor="start" class="muted mono">One row of the equity curve.</text>
  <path d="M 337.0 508 L 337.0 528 L 74 528 Q 60 528 60 514 L 60 86 Q 60 72 74 72 L 329.0 72" stroke="var(--muted)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <text x="52" y="300.0" font-size="11.5" font-weight="400" text-anchor="end" class="muted">next</text>
  <text x="52" y="315.0" font-size="11.5" font-weight="400" text-anchor="end" class="muted">bar</text>
  <rect x="606" y="92" width="296" height="176" rx="8" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="624" y="122" font-size="15" font-weight="650" text-anchor="start" fill="var(--accent)">The timing rule</text>
  <text x="624" y="148" font-size="12.5" font-weight="400" text-anchor="start">A signal computed from bar i's</text>
  <text x="624" y="165" font-size="12.5" font-weight="400" text-anchor="start">close fills at bar i+1's open.</text>
  <text x="624" y="182" font-size="12.5" font-weight="400" text-anchor="start"></text>
  <text x="624" y="199" font-size="12.5" font-weight="400" text-anchor="start">One full bar of delay. Always.</text>
  <text x="624" y="216" font-size="12.5" font-weight="400" text-anchor="start">There is no shift to remember</text>
  <text x="624" y="233" font-size="12.5" font-weight="400" text-anchor="start">because the future is not in</text>
  <text x="624" y="250" font-size="12.5" font-weight="400" text-anchor="start">the room.</text>
  <rect x="606" y="288" width="296" height="232" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="624" y="316" font-size="15" font-weight="650" text-anchor="start">What on_bar can see</text>
  <rect x="626" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="647" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="668" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="689" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="710" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="731" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="752" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="773" y="346" width="17" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="794" y="346" width="17" height="30" rx="3" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="815" y="346" width="17" height="30" rx="3" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="836" y="346" width="17" height="30" rx="3" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="857" y="346" width="17" height="30" rx="3" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="792" y1="338" x2="792" y2="386" stroke="var(--bad)" stroke-width="2" stroke-linecap="round"/>
  <text x="626" y="404" font-size="12" font-weight="400" text-anchor="start" fill="var(--accent)">visible: bars 0..i</text>
  <text x="626" y="422" font-size="12" font-weight="400" text-anchor="start" class="mono" fill="var(--bad)">blocked: LookAheadError</text>
  <text x="624" y="446" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono">view.close[-1]      current bar</text>
  <text x="624" y="464" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono">view.close[-20:]    last 20 bars</text>
  <text x="624" y="482" font-size="11.5" font-weight="400" text-anchor="start" class="mono" fill="var(--bad)">view.close[i + 1]   raises</text>
  <text x="470.0" y="544" font-size="12.5" font-weight="400" text-anchor="middle" class="muted">Vectorised backtests skip steps 1 and 2 entirely. That is where look-ahead bias lives.</text>
</svg>
