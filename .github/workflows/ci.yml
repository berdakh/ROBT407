name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: Run tests
        # The suite must pass with no network and no market data feed. If this
        # ever needs the internet, the workshop has stopped being usable in a
        # room with bad wifi, which is most rooms.
        run: pytest -q

  generated-files-in-sync:
    name: Generated files match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: Notebooks match notebook_src/
        run: python tools/build_notebooks.py --check

      - name: Diagrams match diagrams/src/
        run: python scripts/render_diagrams.py --check

      - name: Committed datasets match the generator
        run: |
          python scripts/build_datasets.py
          if ! git diff --quiet -- data/synthetic; then
            echo "::error::data/synthetic/ does not match algotrade/synthetic.py."
            echo "Run: python scripts/build_datasets.py"
            git diff --stat -- data/synthetic
            exit 1
          fi
          echo "Committed datasets are reproducible."

  notebooks-execute:
    name: All notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: Execute every notebook
        # A workshop notebook that does not run is worse than no notebook,
        # because the student assumes the error is theirs.
        run: python tools/run_notebooks.py

  links:
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: Check links and Colab badges
        run: python tools/check_links.py

  site-builds:
    name: Pages site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site exactly as Pages does
        # Deliberately the SAME action the deploy workflow uses, rather than a
        # hand-rolled `gem install jekyll ...`. An earlier version of this job
        # installed a different gem set from production, which means it could
        # have gone green while the real deploy broke -- and the site uses a
        # remote_theme that only the github-pages gem bundle resolves.
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Every internal link resolves against the served base path
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          site = Path("_site")
          base = "/ROBT407"
          problems = []
          checked = 0

          for page in site.rglob("*.html"):
              html = page.read_text(errors="replace")
              for target in re.findall(r'(?:href|src)="([^"]+)"', html):
                  if target.startswith(("http", "mailto:", "#", "data:", "//")):
                      continue
                  checked += 1
                  if not target.startswith(base + "/"):
                      problems.append(f"{page.relative_to(site)}: {target} is not under {base}/")
                      continue
                  rel = target[len(base) + 1:].split("#")[0].split("?")[0]
                  if not rel or rel.endswith("/"):
                      rel += "index.html"
                  if not (site / rel).exists() and rel != "favicon.ico":
                      problems.append(f"{page.relative_to(site)}: {target} -> no such file")

          if problems:
              print(f"{len(problems)} broken link(s) in the built site:")
              for p in problems[:40]:
                  print(f"  {p}")
              sys.exit(1)
          print(f"All {checked} links in the built site resolve under {base}/.")
          PY

      - name: The landing page and notebook index actually built
        run: |
          for f in index.html notebooks.html plan.html handbook.html \
                   guides/index.html guides/setup.html guides/tools.html \
                   guides/biases.html guides/library.html; do
            test -s "_site/$f" || { echo "::error::_site/$f missing or empty"; exit 1; }
          done
          echo "All 9 pages built."

  safety:
    name: Safety invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: No live trading path exists
        run: |
          pytest tests/test_offline_and_safety.py -q

      - name: No exchange client in the required path
        run: |
          if grep -rEn "^\s*import (ccxt|alpaca|binance)|^\s*from (ccxt|alpaca|binance)" \
               algotrade/ notebook_src/ tests/; then
            echo "::error::An exchange client is imported in the required path."
            echo "This workshop is paper-trading only; only scripts/ may touch the network."
            exit 1
          fi
          echo "No exchange clients in algotrade/, notebook_src/ or tests/."

      - name: Disclaimer present where it matters
        run: |
          fail=0
          grep -q "not investment advice" README.md -i || { echo "::error::README missing disclaimer"; fail=1; }
          grep -q "NOT INVESTMENT ADVICE" algotrade/__init__.py || { echo "::error::package missing disclaimer"; fail=1; }
          grep -q "not investment advice" docs/index.md -i || { echo "::error::site missing disclaimer"; fail=1; }
          grep -q "not investment advice" notebook_src/13_capstone.py -i || { echo "::error::capstone missing disclaimer"; fail=1; }
          grep -q "Educational use only" docs/handbook.md -i || { echo "::error::handbook missing disclaimer"; fail=1; }
          exit $fail
