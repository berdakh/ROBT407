name: Deploy GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be switched on ONCE by a repository admin:
      #   Settings -> Pages -> Source: "GitHub Actions"
      #
      # This cannot be automated from here. `enablement: true` on this step
      # calls the "create a Pages site" API, which needs admin permission; the
      # workflow's GITHUB_TOKEN cannot be granted it (`pages: write` covers
      # deploying to an EXISTING site, not creating one), and it fails with
      # "Resource not accessible by integration". The sister ROBT613 repo hit
      # exactly this and documents it in its own pages.yml.
      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
