<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">The look-ahead trap</title>
  <desc id="desc">A position taken on bar t's signal, applied to bar t's own return, earns a price move that had already finished happening. Shifting the position by one bar removes it. Measured across 40 dataset and seed combinations the leaky version won all 40, including on datasets with no signal at all.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #d0d7de;
      --surface: #f6f8fa;
      --accent: #0969da;
      --accent-bg: #ddf4ff;
      --good: #1a7f37;
      --good-bg: #dafbe1;
      --bad: #cf222e;
      --bad-bg: #ffebe9;
      --warn: #9a6700;
      --warn-bg: #fff8c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #30363d;
        --surface: #161b22;
        --accent: #4493f8;
        --accent-bg: #0c2d6b;
        --good: #3fb950;
        --good-bg: #0f3d1c;
        --bad: #f85149;
        --bad-bg: #4a1418;
        --warn: #d29922;
        --warn-bg: #3d2c00;
      }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .card { fill: var(--surface); stroke: var(--line); }
    .edge { stroke: var(--line); fill: none; }
  </style>
  <rect class="bg" width="960" height="660"/>
  <text x="480.0" y="36" font-size="22" font-weight="650" text-anchor="middle">The look-ahead trap</text>
  <text x="480.0" y="59" font-size="13" font-weight="400" text-anchor="middle" class="muted">One missing index shift. Unlimited imaginary profit.</text>
  <text x="56" y="88" font-size="15" font-weight="650" text-anchor="start" fill="var(--bad)">WRONG — shift = 0</text>
  <text x="56" y="106" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono">position = signal</text>
  <rect x="294" y="104" width="88" height="126" rx="6" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M 294.0 134.3 L 382.0 118.0" stroke="var(--bad)" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 118.0 170.3 L 206.0 174.1 L 294.0 134.3 L 382.0 118.0 L 470.0 204.0 L 558.0 163.7" stroke="var(--muted)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
  <circle cx="118" cy="170.3291654910856" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="118" y="238" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono"></text>
  <circle cx="206" cy="174.06214339908735" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="206" y="238" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono"></text>
  <circle cx="294" cy="134.25263607911438" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="294" y="238" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono">t−1</text>
  <circle cx="382" cy="118.0" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="382" y="238" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono">t</text>
  <circle cx="470" cy="204.0" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="470" y="238" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono">t+1</text>
  <circle cx="558" cy="163.7094463004147" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="558" y="238" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono"></text>
  <circle cx="382" cy="118.0" r="6.5" fill="var(--bad)"/>
  <line x1="382" y1="128.0" x2="382" y2="218" stroke="var(--bad)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="382" y="260" font-size="11" font-weight="600" text-anchor="middle" fill="var(--bad)">signal computed</text>
  <text x="382" y="274" font-size="11" font-weight="400" text-anchor="middle" fill="var(--bad)">from this close</text>
  <text x="604" y="152" font-size="12.5" font-weight="650" text-anchor="start" fill="var(--bad)">captures the move that MADE the signal</text>
  <text x="604" y="174" font-size="11.5" font-weight="400" text-anchor="start" class="muted">That move had already finished</text>
  <text x="604" y="190" font-size="11.5" font-weight="400" text-anchor="start" class="muted">before the signal existed.</text>
  <text x="604" y="206" font-size="11.5" font-weight="400" text-anchor="start" class="muted">You cannot trade the past.</text>
  <text x="56" y="292" font-size="15" font-weight="650" text-anchor="start" fill="var(--good)">RIGHT — shift = 1</text>
  <text x="56" y="310" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono">position = signal.shift(1)</text>
  <rect x="382" y="308" width="88" height="126" rx="6" fill="var(--good-bg)" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M 382.0 322.0 L 470.0 408.0" stroke="var(--good)" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 118.0 374.3 L 206.0 378.1 L 294.0 338.3 L 382.0 322.0 L 470.0 408.0 L 558.0 367.7" stroke="var(--muted)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
  <circle cx="118" cy="374.32916549108563" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="118" y="442" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono"></text>
  <circle cx="206" cy="378.06214339908735" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="206" y="442" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono"></text>
  <circle cx="294" cy="338.2526360791144" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="294" y="442" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono">t−1</text>
  <circle cx="382" cy="322.0" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="382" y="442" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono">t</text>
  <circle cx="470" cy="408.0" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="470" y="442" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono">t+1</text>
  <circle cx="558" cy="367.7094463004147" r="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>
  <text x="558" y="442" font-size="11.5" font-weight="400" text-anchor="middle" class="muted mono"></text>
  <circle cx="382" cy="322.0" r="6.5" fill="var(--good)"/>
  <line x1="382" y1="332.0" x2="382" y2="422" stroke="var(--good)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="382" y="464" font-size="11" font-weight="600" text-anchor="middle" fill="var(--good)">signal computed</text>
  <text x="382" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="var(--good)">from this close</text>
  <text x="604" y="356" font-size="12.5" font-weight="650" text-anchor="start" fill="var(--good)">captures the NEXT move</text>
  <text x="604" y="378" font-size="11.5" font-weight="400" text-anchor="start" class="muted">The only move you could actually</text>
  <text x="604" y="394" font-size="11.5" font-weight="400" text-anchor="start" class="muted">have traded on this signal.</text>
  <text x="604" y="410" font-size="11.5" font-weight="400" text-anchor="start" class="muted">Usually far less kind.</text>
  <rect x="46" y="538" width="868" height="100" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="70" y="564" font-size="14" font-weight="650" text-anchor="start">Measured, not assumed</text>
  <text x="70" y="590" font-size="12" font-weight="400" text-anchor="start">Look-ahead  (shift=0 vs shift=1)</text>
  <text x="370" y="590" font-size="12.5" font-weight="700" text-anchor="start" class="mono" fill="var(--bad)">won 40 / 40</text>
  <text x="70" y="614" font-size="12" font-weight="400" text-anchor="start">Optimistic fill timing  (this_close)</text>
  <text x="370" y="614" font-size="12.5" font-weight="700" text-anchor="start" class="mono" fill="var(--warn)">won 22 / 40</text>
  <line x1="490" y1="568" x2="490" y2="624" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="516" y="586" font-size="12" font-weight="400" text-anchor="start">Look-ahead wins on every dataset — including ones built</text>
  <text x="516" y="604" font-size="12" font-weight="400" text-anchor="start">with no signal in them at all. That universality is the tell:</text>
  <text x="516" y="622" font-size="12" font-weight="600" text-anchor="start">a real edge does not work on pure noise.</text>
</svg>
